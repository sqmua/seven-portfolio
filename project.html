<article class="case-content">
<section id="overview" class="content-section"><p class="section-label">01 / OVERVIEW</p><h2>项目概览</h2><div class="fact-grid"><div><b>项目时间</b><p>${p.date}</p></div><div><b>项目类型</b><p>${p.type}</p></div><div><b>我的职责</b><p>${p.role}</p></div><div><b>服务对象</b><p>${p.client}</p></div></div><div class="source-context"><b>作品集项目说明</b><p>${source}</p></div><div class="two-copy"><div><h3>项目背景</h3><p>${d.background}</p></div><div><h3>项目目标</h3><p>${d.goal}</p></div></div></section>
